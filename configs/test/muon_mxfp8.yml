# configs/test/muon_mxfp8.yml
# --------------------------
# MXFP8 (E4M3 + per-block E8M0) muon momentum storage smoke test.
# Mirrors configs/test/quick.yml but flips muon_momentum from
# the canonical bf16 default to mxfp8. ~30s on the 5060 Ti 16G.
#
# Run: python scripts/train.py --config configs/test/muon_mxfp8.yml
#
# base.yml is already on mxfp8 muon_momentum; this yml just
# inherits the full precision section and runs the same
# smoke model + data layout as quick.yml.
extends: ../base.yml

use_dummy_data: true

num_layers: 2
num_blocks: 2
num_heads: 2
head_dim: 32
hidden_size: 64
intermediate_size: 128
vocab_size: 256

batch_size: 2
seq_len: 256
gradient_accumulation_steps: 1
max_steps: 4

output_dir: output/muon_mxfp8
log_interval: 1
checkpoint_interval: 4

lr_warmup_steps: 0
lr_decay_steps: 0