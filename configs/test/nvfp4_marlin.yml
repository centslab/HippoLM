# configs/test/nvfp4_marlin.yml
# ---------------------------
# Smoke test for the W4A16 NVFP4 FFN path with the Marlin fused kernel
# (FFN weights stored as NVFP4 packed uint8 + fp8_e4m3fn scales +
# global_scale scalar; forward matmul runs in vLLM's Marlin FP4
# kernel, ~3.5x faster than the dequant+cuBLAS path at FFN shapes
# on sm_120).
#
# Run: python scripts/train.py --config configs/test/nvfp4_marlin.yml
#
# Inherits from ../base.yml (the production defaults).
extends: ../base.yml

# Diff vs base.yml:
#   * ffn_nvfp4=true — every FFN linear uses the NVFP4 storage path
#     (packed uint8 + fp8_e4m3fn scales + global_scale scalar).
#   * ffn_nvfp4_marlin=true — the forward matmul uses vLLM's Marlin
#     FP4 kernel instead of dequant+cuBLAS.
#   * Smaller dims + dummy data + tp_size=1 — same shape as tp1.yml
#     so we exercise the NVFP4 layer construction in the single-GPU
#     ``SwiGLU`` path (the TP variants are exercised via nvfp4_vram_probe
#     and the production configs/test/tp2.yml variant).
#   * No checkpoint save — we just want to verify the fwd/bwd/opt
#     loop completes without NaN/Inf and the loss decreases.
ffn_nvfp4: true
ffn_nvfp4_marlin: true
ffn_nvfp4_no_bf16_master: true

tp_size: 1

num_heads: 2
head_dim: 64
hidden_size: 128
intermediate_size: 256
vocab_size: 512

use_dummy_data: true

batch_size: 1
seq_len: 512
gradient_accumulation_steps: 1
max_steps: 4

output_dir: output/nvfp4_marlin
log_interval: 1
checkpoint_interval: 0
