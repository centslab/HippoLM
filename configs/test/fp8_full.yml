# configs/test/fp8_full.yml
# ------------------------
# Full-FP8 productionization: enables both producer-side quant fusions
# (FP8 residual + FP8 silu_mul) on top of the W8A8 KDA + W4A8 FFN
# already in production. The fp8_residual / fp8_silu_mul flags gate
# the per-layer fused Triton kernels in src/models/ops/.
#
# Run: python scripts/train.py --config configs/test/fp8_full.yml
#
# Diff vs base.yml:
#   * use_dummy_data=true (no streaming / tokenize)
#   * Smaller model: 2 layers / 1 block / 2 heads. Block size = 2
#     to satisfy the TP model's hardcoded ``_sub_block_layers = 2``
#     constraint (block_size must be a multiple of 2).
#   * 4 microbatch steps, no gradient accumulation, single GPU
#   * TP sim off (FP8 path is per-rank sharded; TP sim exercises
#     all-reduce which is a no-op on single GPU; not needed for
#     FP8 kernel fwd/bwd verification)
#   * fp8_residual=true and fp8_silu_mul=true
extends: ../base.yml

use_dummy_data: true

num_layers: 2
num_blocks: 1
num_heads: 2
head_dim: 32
hidden_size: 64
intermediate_size: 128
vocab_size: 256

batch_size: 2
seq_len: 256
gradient_accumulation_steps: 1
max_steps: 4

output_dir: output/fp8_full
log_interval: 1
checkpoint_interval: 0

# WSD LR needs > lr_warmup_steps + lr_decay_steps to actually enter
# the stable phase. fp8_full is too short — leave both at 0
# (constant LR).
lr_warmup_steps: 0
lr_decay_steps: 0

# 5-scheme precision (already in base.yml for the production path)
# — fp8_full keeps KDA W8A8 (FP8 GEMM), FFN W8A8 (forces the path
# that exercises SiluMulFp8STE — production uses W4A8 but the silu
# side is identical at the fwd+bwd level).
attention_precision: w8a8
ffn_precision: w8a8

# Producer-side FP8 fusions (the new flags shipped 2026-07-22).
fp8_residual: true
fp8_silu_mul: true
