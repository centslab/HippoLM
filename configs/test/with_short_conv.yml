# configs/test/with_short_conv.yml
# -------------------------------
# KDA in chunk mode with the short conv enabled. The "default"
# path — exists as a config for symmetry with `no_short_conv.yml`
# so a future ablation study has a clean two-way toggle. ALSO
# exercises the depthwise conv1d forward / backward (which lives
# at `*.q_conv1d.weight` / `*.k_conv1d.weight` / `*.v_conv1d.weight`
# and is routed to AdamW per `docs/optimizer_layout.md`).
#
# Run: python scripts/train.py --config configs/test/with_short_conv.yml
#
# Inherits from ../base.yml (the production defaults).
extends: ../base.yml

# Diff vs base.yml:
#   * kda_mode=chunk, use_short_conv=true (both pinned explicitly)
#   * conv_size=4 (default; pinned for clarity)
#   * Smaller dims + dummy data
kda_mode: chunk
use_short_conv: true
conv_size: 4
conv_bias: false

num_heads: 2
head_dim: 64
hidden_size: 128
intermediate_size: 256
vocab_size: 512

use_dummy_data: true

batch_size: 1
seq_len: 512
gradient_accumulation_steps: 2
max_steps: 4

output_dir: output/with_short_conv
log_interval: 1
checkpoint_interval: 0
