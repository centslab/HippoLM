# configs/test/kda_chunk.yml
# --------------------------
# KDA in chunk mode (the training / production path). This is the
# config that exercises the heavy Triton chunkwise kernels
# (chunk_kda_fwd_kernel_intra_sub_chunk, _inter_solve_fused, the
# matching bwd kernels). ~5 min on the 5060 Ti 16G including the
# K=128 Triton compile on the first step.
#
# Run: python scripts/train.py --config configs/test/kda_chunk.yml
#
# Inherits from ../base.yml (the production defaults).
extends: ../base.yml

# Diff vs base.yml:
#   * kda_mode=chunk (explicit; the default, but pin it for clarity)
#   * use_short_conv=true (default; the chunk path requires it)
#   * use_dummy_data=true (no streaming / tokenize)
#   * Reduced step count + log interval for an interactive run
#   * Head_dim 128 / num_heads 12 to match production K=128 shmem
kda_mode: chunk
use_short_conv: true

use_dummy_data: true

batch_size: 1
seq_len: 2048
gradient_accumulation_steps: 4
max_steps: 4

output_dir: output/kda_chunk
log_interval: 1
checkpoint_interval: 0
