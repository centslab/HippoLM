# configs/test/nvfp4_marlin_tp2.yml
# --------------------------------
# Smoke test for the W4A16 NVFP4 FFN path with the Marlin fused kernel
# in TP=2 mode (ffn_precision='w4a16' + tp_sim + tp_size=2). This
# exercises the row-parallel Marlin path (down_proj all-reduce) which
# the tp1 variant does NOT cover (tp_size=1 means the row-parallel
# case degenerates to a no-all-reduce fast path).
#
# Run: python scripts/train.py --config configs/test/nvfp4_marlin_tp2.yml
#
# Inherits from ../base.yml (the production defaults).
extends: ../base.yml

# Diff vs base.yml:
#   * ffn_precision="w4a16" — every FFN linear uses the W4A16 NVFP4
#     path: NVFP4ColumnParallelLinear + NVFP4RowParallelLinear with
#     Marlin mode-3 (hardcoded). FP4 packed buffers are the source
#     of truth; no BF16 master.
#   * tp_sim=true, tp_size=2 — exercises the row-parallel Marlin
#     path (down_proj all-reduce) on a single GPU via gloo.
#
# Note: this test covers W4A16 (Marlin) — the canonical prod FFN
# scheme. W4A8 in TP is not implemented on sm_120 today (no NVFP4
# W4A8 Column/Row-Parallel); the FFN wrapper falls back to BF16 TP
# with a RuntimeWarning when ``ffn_precision='w4a8'`` is set on a
# TP path.
ffn_precision: w4a16

tp_sim: true
tp_size: 2

num_heads: 2
head_dim: 64
hidden_size: 128
intermediate_size: 256
vocab_size: 512

use_dummy_data: true

batch_size: 2
seq_len: 512
gradient_accumulation_steps: 1
max_steps: 4

output_dir: output/nvfp4_marlin_tp2
log_interval: 1
checkpoint_interval: 0
