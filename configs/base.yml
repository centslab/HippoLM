# HippoLM Training Configuration

# Model Architecture
vocab_size: 248320
hidden_size: 1024
num_heads: 16
head_dim: 64
num_kv: 64
num_layers: 32
num_blocks: 8
intermediate_size: 2736
tie_word_embeddings: true
use_bias: false

# Normalization
rms_norm_eps: 1e-6

# Position Encoding
max_seq_len: -1  # -1 means unlimited context in code

# Training
epochs: 1
max_steps: 1000
batch_size: 2
seq_len: 512
learning_rate: 1.0e-4
weight_decay: 0.01
gradient_accumulation_steps: 4
gradient_checkpointing: true
checkpoint_every_layer: false
fp16: true

# Stage: pretrain or sft
stage: pretrain

# Data (HF datasets streamed from hf-mirror.com)
# Set HF_ENDPOINT=https://hf-mirror.com before running
pretrain_dataset: openbmb/Ultra-FineWeb-L3
sft_dataset: openbmb/UltraData-SFT-2605
tokenizer_path: src/tokenizer

# Output
output_dir: output
log_interval: 10
checkpoint_interval: 100

# GPU
min_gpu_memory_mb: 10240
num_workers: 2
