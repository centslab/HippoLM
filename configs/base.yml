# HippoLM Training Configuration

# Model Architecture
vocab_size: 248320
hidden_size: 1024
tie_word_embeddings: true
use_bias: false

# EFKDA (EFLA-form KDA: KDA recurrence re-expressed with the rank-1
# closed-form alpha = (1 - exp(-beta*||k||^2)) / ||k||^2; see
# src/models/ops/efkda.py and arXiv 2512.12602).
num_heads: 8
head_dim: 128
expand_v: 1.0
efkda_kernel: triton       # "triton" = production (fwd via Triton, bwd via PyTorch ref), "ref" = pure-PyTorch (debug only)
efkda_mode: chunk
use_short_conv: true
allow_neg_eigval: false
conv_size: 4
conv_bias: false

# Architecture Depth
num_layers: 32
num_blocks: 8

# FFN (SwiGLU)
intermediate_size: 3072

# Normalization
rms_norm_eps: 0.000001

# Training
epochs: 1
max_steps: 1000
batch_size: 4
seq_len: 4096
learning_rate: 0.01
weight_decay: 0.01
gradient_accumulation_steps: 16
# Chunk-aware FFD packing (see src/training/data/collate.py).
# ``pack_chunk_size``: alignment granularity for doc boundaries inside
# a pack. Each doc rounds up to a multiple of this size so the GDN2
# chunkwise kernel's state reset lands exactly at a doc boundary.
# 0 means "use head_dim" (HippoConfig resolves). Rounded up to a
# multiple of 64 internally (the vendored GDN2 kernel's BT).
pack_chunk_size: 0
# How many input docs the owner prefetcher accumulates per packing
# window. Each window produces batch_size packed rows. Higher =
# denser FFD packs at the cost of one window's latency.
pack_buffer_size: 8

# Optimizer
muon_lr: 0.02            # Muon (2D matrices) learning rate
muon_momentum: 0.95      # SGD momentum for the Muon path
max_grad_norm: 1.0       # Pre-clip L2 norm (TP-reduced). <=0 disables clipping.
seed: 42                 # RNG seed for replicated-param init on each device.

# Precision
# Each entry sets the storage dtype for a tensor class. Supported dtypes:
#   fp32, fp16, bf16   - floating point; no scaling needed
#   int8, int4         - integer; require a scale mode
# Scale modes (int8/int4 only; ignored for fp*):
#   no                 - no scaling (raw integer values)
#   tensor             - one scale per tensor
#   per-channel        - one scale per output channel (per-row for 2D weights)
#   block              - one scale per block of `block_size` consecutive elements
# ``activations`` only accepts the floating dtypes (fp32/fp16/bf16).
# fp16 / bf16 enable ``torch.amp.autocast`` with that dtype; fp32
# disables autocast and runs a pure FP32 forward.
precision:
  model_weights: { dtype: bf16 }
  gradients:     { dtype: bf16 }
  activations:   { dtype: bf16 }
  muon_momentum: { dtype: bf16 }
  adamw_m:       { dtype: bf16 }
  adamw_v:       { dtype: bf16 }

# Stage: pretrain or sft
stage: pretrain

# Data: dual-source streaming with ModelScope preferred (Aliyun CDN is
# much faster than hf-mirror.com). On network/connection errors only,
# we fall back to the HF mirror. Set use_modelscope=false to force HF.
use_modelscope: true
pretrain_dataset_hf: openbmb/Ultra-FineWeb-L3
pretrain_dataset_ms: OpenBMB/Ultra-FineWeb-L3
pretrain_config: Ultra-FineWeb-L3-en-QA-Synthetic
# Multi-source pretrain: stream 4 Ultra-FineWeb-L3 subsets in a
# 2-phase schedule (multi-style first, then QA), with English
# weighted 2x over Chinese. Phase 0: en_multi *2 + zh_multi *1.
# Phase 1: en_qa *2 + zh_qa *1. When all 4 are exhausted, the
# schedule restarts from phase 0 (infinite stream). When false,
# the single-source ``pretrain_config`` path is used.
pretrain_multi_source: true
pretrain_en_multi_config: Ultra-FineWeb-L3-en-Multi-Style-Synthetic
pretrain_zh_multi_config: Ultra-FineWeb-L3-zh-Multi-Style-Synthetic
pretrain_en_qa_config: Ultra-FineWeb-L3-en-QA-Synthetic
pretrain_zh_qa_config: Ultra-FineWeb-L3-zh-QA-Synthetic
sft_dataset_hf: openbmb/UltraData-SFT-2605
sft_dataset_ms: OpenBMB/UltraData-SFT-2605
sft_config: null
text_field: content
tokenizer_path: src/tokenizer
# Disable shuffle: the 1000-sample shuffle buffer causes random shard
# access which multiplies per-shard latency and makes the first batch
# take minutes on either CDN. Sequential streaming is fine for the
# v0.0.0 validation run (1000 steps).
shuffle: false
# Skip streaming + tokenize; use random tokens. Cheap smoke test for the
# model + optimizer + TP code path.
use_dummy_data: false

# Output
output_dir: output
log_interval: 1
checkpoint_interval: 100

# GPU
min_gpu_memory_mb: 10240

# TP simulation (single-GPU dev box): spawn N processes all bound to
# cuda:0, transport collectives via gloo. Verifies the sharding code
# paths without owning N physical GPUs. Much slower than NVLink NCCL.
tp_sim: false
tp_size: 2
