# HippoLM Training Configuration
#
# Parameter explanations live in docs/base_yml_reference.md.
# This file is a pure key → value table; running `diff` against
# it should only show the values that actually changed.

# Model Architecture
vocab_size: 248320
hidden_size: 1536
tie_word_embeddings: true
use_bias: false

# KDA (Kimi Delta Attention)
num_heads: 12
head_dim: 128
expand_v: 1.0
kda_mode: chunk
use_short_conv: true
allow_neg_eigval: false
safe_gate: true
lower_bound: -5.0
conv_size: 4
conv_bias: false

# Architecture Depth
num_layers: 32
num_blocks: 8

# FFN (SwiGLU)
intermediate_size: 4096

# Normalization
rms_norm_eps: 0.000001

# Training
epochs: 1
max_steps: 1000
batch_size: 1
seq_len: 262144
micro_batch_size: 16384
lr_warmup_steps: 0
lr_decay_steps: 100
gradient_accumulation_steps: 16
pack_chunk_size: 64
pack_buffer_size: 2048

# Optimizer hparams
optimizer:
  adamw: { lr: 0.004, weight_decay: 0.01, beta1: 0.9, beta2: 0.95, eps: 1e-8 }
  # Muon SGD momentum EMA storage: fp8_2d_tight ships 2026-07-16
  # (see auto-memory project_2d_tight_scale.md). E4M3 + per-(row ×
  # col-block) + per-(col × row-block) FP32 scales; brings NS output
  # drift from 14-21% (per-tensor baseline) to 1.45% on B/D regimes
  # at the prod shape. The BF16 buffer at storage is
  # precision.muon_momentum.dtype (BF16 in this base config); only
  # the persistent storage layout changes.
  muon:  { lr: 0.02, weight_decay: 0.0, momentum: 0.95,
           exp_avg_storage: fp8_2d_tight, block_size: 32 }
max_grad_norm: 1.0
seed: 42

# Precision
precision:
  model_weights: { dtype: bf16 }
  gradients:     { dtype: bf16 }
  activations:   { dtype: bf16 }
  muon_momentum: { dtype: bf16 }
  adamw_m:       { dtype: bf16 }
  adamw_v:       { dtype: bf16 }

# Stage: pretrain or sft
stage: pretrain

# Data
use_modelscope: true
pretrain_dataset_hf: openbmb/Ultra-FineWeb-L3
pretrain_dataset_ms: OpenBMB/Ultra-FineWeb-L3
pretrain_config: Ultra-FineWeb-L3-en-QA-Synthetic
pretrain_multi_source: true
pretrain_en_multi_config: Ultra-FineWeb-L3-en-Multi-Style-Synthetic
pretrain_zh_multi_config: Ultra-FineWeb-L3-zh-Multi-Style-Synthetic
pretrain_en_qa_config: Ultra-FineWeb-L3-en-QA-Synthetic
pretrain_zh_qa_config: Ultra-FineWeb-L3-zh-QA-Synthetic
sft_dataset_hf: openbmb/UltraData-SFT-2605
sft_dataset_ms: OpenBMB/UltraData-SFT-2605
sft_config: null
text_field: content
tokenizer_path: src/tokenizer
shuffle: false
use_dummy_data: false
# Local cache directory for the HIPPOLM-side streamed parquet shards
# (the actual files our RotatingParquetIterable downloads). Wires
# through to the HIPPOLM_CACHE_DIR env var that
# src/training/data/cache.py:get_cache_dir() honors. null =
# repo-relative .cache/hippolm/datasets. Override (CLI flag or
# this key) when the default location is short on disk space.
#
# SDK-side caches (ModelScope + HF datasets) are pinned to
# <repo>/.cache/modelscope/ and <repo>/.cache/huggingface/datasets/
# automatically by src/training/env.py:pin_cache_directories() —
# set MODELSCOPE_CACHE / HF_HOME in the env (or the repo's .env)
# to relocate them.
cache_dir: null

# Output
output_dir: output
log_interval: 1
checkpoint_interval: 100
checkpoint_keep_last_n: 3

# GPU
min_gpu_memory_mb: 10240

# TP simulation
tp_sim: false
tp_size: 2

# Misc
mb_timing: 0
# Disable ``torch.cuda.empty_cache()`` between micro-batches. The
# caching allocator already reuses freed blocks for the next chunk;
# forcing the blocks back to CUDA only forces a fresh ``cudaMalloc``
# on the next allocation. 5060 Ti 16G benchmark (test/_tmp/bench_step.py,
# seq=4096, 8 layers, 4 chunks/step, 10 steps): 1958 ms → 1870 ms
# (-4.5%); HWM unchanged at 223 MiB (``empty_cache`` returns blocks
# to the driver, but PyTorch's ``max_memory_allocated`` tracks the
# peak of CUDA-side allocations, which doesn't drop with empty_cache
# — see ``docs/empty_cache_off.md``).
empty_cache_between_mb: false
kda_skip_aqk_akk_saved: false

# Scheme-driven precision (2026-07-21, 5-scheme spec).
# Each of the three module groups picks ONE scheme. The kernel
# choice (two-pass vs Marlin, FP8 vs BF16 GEMM, FP8 vs BF16 grads)
# is hardcoded per scheme — no per-config knobs. MXFP4 / MXFP8 are
# NOT supported (only NVFP4 for w4*; E4M3 for w8*). The 5 schemes
# (W = weight storage, a = activation/GEMM/grad precision):
#
#   w16a16 — pure BF16. Default. nn.Linear + cuBLAS BF16.
#   w8a16  — FP8 storage + BF16 GEMM + BF16 grads. No kernel
#            today (dequant-to-BF16 path missing); falls back to
#            w16a16 with warning. Not used by this config.
#   w8a8   — FP8 storage + FP8 GEMM + FP8 grads.
#            FP8Linear(fp8_bwd=True). FP8 _scaled_mm fwd+bwd.
#   w4a16  — NVFP4 storage + BF16 GEMM + BF16 grads.
#            NVFP4Linear (Marlin mode-3). FP4 packed buffers ARE
#            source of truth. The canonical prod FFN scheme.
#   w4a8   — NVFP4 storage + FP8 GEMM + FP8 grads (spec).
#            NVFP4LinearW4A8 (two-pass Triton dequant +
#            _scaled_mm). Current bwd is BF16 STE (spec gap; TODO).
#            The FP8-feasibility-branch FFN scheme.
#
# This branch's canonical config (FP8 feasibility branch):
embedding_precision: w16a16   # storage-only; no GEMM gain
attention_precision: w8a8      # FP8 GEMM in q/k/v/o + g_proj
ffn_precision: w4a8            # NVFP4 two-pass W4A8

# Producer-side FP8 fusions (2026-07-22, full-FP8 productionization).
# These run on top of the module-group precision schemes above:
#
#   fp8_rmsnorm:   RMSNorm(BF16→BF16) + quantize_act_fp8_fused →
#                  fused RMSNorm→FP8 Triton kernel (1 launch instead
#                  of 2). STE on FP8 quant; proper RMSNorm bwd
#                  preserves dL/dweight. KDA's q/k/v/o act_quant
#                  and FFN's gate/up act_quant still re-quantize the
#                  BF16 dequant output — the FP8+scale from this
#                  kernel is currently discarded. Saves 1 launch per
#                  RMSNorm × 2 RMSNorms per layer = 2 launches/layer.
#
#   fp8_residual:  the residual stream is the load-bearing path for
#                  the L-layer sqrt(N) noise compounding, so we keep
#                  it BF16 (x + sub elementwise add). Previous e2e
#                  probe showed +0.27% loss delta at 300 steps with
#                  full FP8; the residual contribution amplifies that
#                  further when enabled. Pin OFF.
#
#   fp8_silu_mul:  silu(gate)*up + quantize_act_fp8_fused → fused
#                  silu_mul_fp8 Triton kernel. Saves 2 launches per
#                  FFN sublayer (silu + mul + quant → 1 fused launch).
#                  The downstream down_proj (W4A8) still does its own
#                  internal act_quant on the BF16 dequant output.
fp8_rmsnorm: true
fp8_residual: false
fp8_silu_mul: true
