# HippoLM Training Configuration

# Model Architecture
vocab_size: 248320
hidden_size: 1536
tie_word_embeddings: true
use_bias: false

# KDA (Kimi Delta Attention)
num_heads: 12
head_dim: 128
expand_v: 1.0
kda_mode: chunk            # chunk for training, fused_recurrent for inference
use_short_conv: true
allow_neg_eigval: false
# ``safe_gate`` enables the M=16 TensorCore fast path in chunk_kda
# (bwd intra + dhu + wy_dqkg). Requires ``lower_bound`` so the
# chunk-cumsummed gate activation stays in a numerically safe range.
# Recommended ``lower_bound`` is ``-5`` (FLA's default).
safe_gate: true
lower_bound: -5.0
conv_size: 4
conv_bias: false

# Architecture Depth
num_layers: 32
num_blocks: 8

# FFN (SwiGLU)
intermediate_size: 4096

# Normalization
rms_norm_eps: 0.000001

# Training
epochs: 1
max_steps: 1000
batch_size: 1
# Total tokens per step (one super-long FFD-packed sequence).
# 262144 = 16 × 16384 = same total tokens/step as the legacy
# ``seq_len=16384, gradient_accumulation_steps=16`` config.
seq_len: 262144
# Chunk size: the super-long sequence is split into
# ``seq_len // micro_batch_size = 16`` chunks of this many
# tokens each, with the KDA recurrent state carried between
# chunks (full BPTT). Default 16384 matches the legacy per-
# microbatch length so backward-compat configs continue to
# train one chunk per "old" microbatch.
micro_batch_size: 16384
# ``learning_rate`` and ``weight_decay`` are no longer top-level
# keys — they live inside the ``optimizer:`` block below (under
# ``optimizer.adamw:`` for the AdamW side). Override either via
# the nested block in a child yml or the corresponding flat CLI
# flag (``--learning_rate``, ``--weight_decay``).
lr_warmup_steps: 0
lr_decay_steps: 100
# Derived: n_chunks = seq_len / micro_batch_size = 16. Kept as
# a config knob for documentation; the training loop ignores
# this value and computes ``n_chunks`` from seq_len and
# micro_batch_size directly. Set to any value — the new loop
# only reads seq_len and micro_batch_size.
gradient_accumulation_steps: 16
# Chunk-aware FFD packing (see src/training/data/collate.py).
# ``pack_chunk_size``: alignment granularity for doc boundaries inside
# a pack. Each doc rounds up to a multiple of this size so the KDA
# chunkwise kernel's state reset lands exactly at a doc boundary.
# 0 means "use head_dim" (HippoConfig resolves). Rounded up to a
# multiple of 64 internally (the vendored KDA kernel's BT).
pack_chunk_size: 64
# How many input docs the owner prefetcher accumulates per packing
# window (pulls ``batch_size * pack_buffer_size`` docs per window).
# The packer uses a fixed-pack FFD that ALWAYS emits exactly
# ``batch_size`` packed rows, so the consumer's microbatch batch
# dim matches ``batch_size`` by contract — overflow docs are dropped
# and empty packs are filled with ``pad_id`` + ``-100`` labels.
# Higher ``pack_buffer_size`` = more candidates for FFD = denser
# packs (less tail-pad per pack), at the cost of one window's
# prefetch latency. With default B=1 and pack_buffer_size=8 we only
# pull 8 docs per window, which under-fills a T=16384 pack; raise
# to 32-64 if you see sparse packs in the First-batch heartbeat.
pack_buffer_size: 2048

# Optimizer hparams (grouped by optimizer; both ``weight_decay`` and
# ``lr`` are now per-optimizer rather than shared).
#
#   adamw: 1-D params (RMSNorm / KDA A_log / dt_bias / BlockAttnRes
#          query / embed_tokens / lm_head / KDA short-conv 3-D
#          weights).
#   muon:  2-D Linear weights (the dominant bulk of params on this
#          stack).
#
# Each sub-block accepts ``lr`` + ``weight_decay`` (``muon`` also
# takes ``momentum``). Override either the flat CLI flag
# (``--muon_lr``, ``--muon_weight_decay``, …) or any single nested
# sub-key in a child yml; flat keys win over the nested block.
# To disable Muon-side weight decay entirely, set
# ``optimizer.muon.weight_decay: 0.0`` (the default).
optimizer:
  # beta1 / beta2 follow the merged-accumulator AdamW design: m is
  # the raw sum of microbatch grads (no β1 EMA across cycles), so
  # beta1 is stored / serialized / logged but the step() algorithm
  # only consumes beta2 for v = β2*v + (1-β2)*m² + bc2. Default
  # values match the v0.0.x hardcoded (0.9, 0.95) so existing
  # checkpoints carry the same math after a config-only refactor.
  # ``eps`` is the AdamW epsilon inside ``sqrt(v/bc2) + eps``. Default
  # 1e-8 matches the previously-hardcoded value in build_param_groups.
  adamw: { lr: 0.004, weight_decay: 0.01, beta1: 0.9, beta2: 0.95, eps: 1e-8 }
  muon:  { lr: 0.02, weight_decay: 0.0, momentum: 0.95 }
max_grad_norm: 1.0       # Pre-clip L2 norm (TP-reduced). <=0 disables clipping.
seed: 42                 # RNG seed for replicated-param init on each device.

# Precision
# Each entry sets the storage dtype for a tensor class. Supported dtypes:
#   fp32, fp16, bf16   - floating point; no scaling needed
#   int8, int4         - integer; require a scale mode
#   mxfp8              - OCP Microscaling FP8: E4M3 elements +
#                        per-block E8M0 scale. ``block_size``
#                        defaults to 32 when not given; ``scale``
#                        is implicitly ``'block'``. Currently
#                        only used for ``muon_momentum`` — the
#                        per-block scale gives finer within-row
#                        granularity than per-row int8 without a
#                        separate accumulator buffer. See
#                        :class:`src.training.precision_config.TensorPrecision`
#                        for the validation rules and
#                        :mod:`docs.mxfp8_3_bugs` for the three
#                        latent bugs caught while shipping this.
# Scale modes (int8/int4 only; ignored for fp* and mxfp8):
#   no                 - no scaling (raw integer values)
#   tensor             - one scale per tensor
#   per-channel        - one scale per output channel (per-row for 2D weights)
#   block              - one scale per block of `block_size` consecutive elements
# ``activations`` only accepts the floating dtypes (fp32/fp16/bf16).
# fp16 / bf16 enable ``torch.amp.autocast`` with that dtype; fp32
# disables autocast and runs a pure FP32 forward.
precision:
  model_weights: { dtype: bf16 }
  gradients:     { dtype: bf16 }
  activations:   { dtype: bf16 }
  # muon_momentum storage. Default is bf16. The mxfp8 (E4M3 +
  # per-32 E8M0) and int8 (BF16 per-row scale) code paths
  # exist and are exercised by ``configs/test/muon_mxfp8.yml``
  # and ``configs/test/muon_int8.yml`` — they're selectable
  # for memory-constrained experiments, but they are NOT
  # production: the per-mb quant error compounds over many
  # gradient-accumulation steps and training diverges (see
  # :mod:`docs.mxfp8_3_bugs` for the analysis). For prod,
  # bf16 momentum gives the full-precision grad-sum feed
  # to Newton-Schulz orthogonalization.
  muon_momentum: { dtype: bf16 }
  adamw_m:       { dtype: bf16 }
  adamw_v:       { dtype: bf16 }

# Stage: pretrain or sft
stage: pretrain

# Data: dual-source streaming with ModelScope preferred (Aliyun CDN is
# much faster than hf-mirror.com). On network/connection errors only,
# we fall back to the HF mirror. Set use_modelscope=false to force HF.
use_modelscope: true
pretrain_dataset_hf: openbmb/Ultra-FineWeb-L3
pretrain_dataset_ms: OpenBMB/Ultra-FineWeb-L3
pretrain_config: Ultra-FineWeb-L3-en-QA-Synthetic
# Multi-source pretrain: stream 4 Ultra-FineWeb-L3 subsets in a
# 2-phase schedule (multi-style first, then QA), with English
# weighted 2x over Chinese. Phase 0: en_multi *2 + zh_multi *1.
# Phase 1: en_qa *2 + zh_qa *1. When all 4 are exhausted, the
# schedule restarts from phase 0 (infinite stream). When false,
# the single-source ``pretrain_config`` path is used.
pretrain_multi_source: true
pretrain_en_multi_config: Ultra-FineWeb-L3-en-Multi-Style-Synthetic
pretrain_zh_multi_config: Ultra-FineWeb-L3-zh-Multi-Style-Synthetic
pretrain_en_qa_config: Ultra-FineWeb-L3-en-QA-Synthetic
pretrain_zh_qa_config: Ultra-FineWeb-L3-zh-QA-Synthetic
sft_dataset_hf: openbmb/UltraData-SFT-2605
sft_dataset_ms: OpenBMB/UltraData-SFT-2605
sft_config: null
text_field: content
tokenizer_path: src/tokenizer
# Disable shuffle: the 1000-sample shuffle buffer causes random shard
# access which multiplies per-shard latency and makes the first batch
# take minutes on either CDN. Sequential streaming is fine for the
# v0.0.0 validation run (1000 steps).
shuffle: false
# Skip streaming + tokenize; use random tokens. Cheap smoke test for the
# model + optimizer + TP code path.
use_dummy_data: false

# Output
output_dir: output
log_interval: 1
checkpoint_interval: 100
# After each save, prune older checkpoint_step_*.pt files so at most
# N remain (newest N kept). null/None keeps all. Set to 0 to keep
# only the just-saved file.
checkpoint_keep_last_n: 3

# GPU
min_gpu_memory_mb: 10240

# TP simulation (single-GPU dev box): spawn N processes all bound to
# cuda:0, transport collectives via gloo. Verifies the sharding code
# paths without owning N physical GPUs. Much slower than NVLink NCCL.
tp_sim: false
tp_size: 2

# Per-microbatch timing breakdown (see scripts/cli.py). 0 disables.
# When > 0, logs data_ms / h2d_ms / fwd_ms / bwd_ms / sync_ms for
# the first N microbatches of every step.
mb_timing: 0
# Release the caching-allocator slack pool back to the driver after
# each microbatch. Frees ~4 GB of pool on the 16 GB production config
# at the cost of ~24 ms/mb (+0.7% wall-clock).
empty_cache_between_mb: true
# Skip saving the KDA per-chunk attention statistics Aqk + Akk in
# the forward pass; recompute them in the backward pass via
# chunk_kda_fwd_intra. Trades a small bwd time increase for ~32 MiB
# of saved-tensor memory per KDA layer (~1 GB at 30 layers).
kda_skip_aqk_akk_saved: false

# W4A16 NVFP4 FFN (research path). When True, every FFN linear
# stores its weight in NVFP4 packed format (E2M1 + FP8-e4m3fn 1x16
# microblock scales). Activation stays in BF16; the matmul itself
# runs in BF16 (dequantize-on-fwd) since PyTorch 2.9.1's
# ``torch._scaled_mm`` NVFP4 path requires both A and B to be FP4.
# Memory saving: ~3.5x on FFN weights (the dominant FFN cost on
# the 16 GB target). The optimizer updates the BF16 master weight;
# ``repack_nvfp4_weights`` re-quantizes after each step.
ffn_nvfp4: true
# Pre-RMSNorm fusion into the FFN gate_up projection (Opt-1).
# Absorbs mlp_norm into the gate_up_proj forward via the fused
# RMSNorm+NVFP4 matmul Function. Saves ~48 MiB per layer of saved
# activations (~1500 MiB across 32 layers).
ffn_prenorm_fusion: true
