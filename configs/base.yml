# HippoLM Training Configuration

# Model Architecture
vocab_size: 248320
hidden_size: 1024
tie_word_embeddings: true
use_bias: false

# KDA (Kimi Delta Attention)
num_heads: 8
head_dim: 128
expand_v: 1.0
kda_mode: chunk            # chunk for training, fused_recurrent for inference
use_short_conv: true
allow_neg_eigval: false
safe_gate: false
lower_bound: null
conv_size: 4
conv_bias: false

# Architecture Depth
num_layers: 32
num_blocks: 8

# FFN (SwiGLU)
intermediate_size: 3072

# Normalization
rms_norm_eps: 0.000001

# Training
epochs: 1
max_steps: 1000
batch_size: 1
seq_len: 4096
learning_rate: 1.0e-4
weight_decay: 0.01
gradient_accumulation_steps: 256
fp16: true

# Stage: pretrain or sft
stage: pretrain

# Data: dual-source streaming with ModelScope preferred (Aliyun CDN is
# much faster than hf-mirror.com). On network/connection errors only,
# we fall back to the HF mirror. Set use_modelscope=false to force HF.
use_modelscope: true
pretrain_dataset_hf: openbmb/Ultra-FineWeb-L3
pretrain_dataset_ms: OpenBMB/Ultra-FineWeb-L3
pretrain_config: Ultra-FineWeb-L3-en-QA-Synthetic
sft_dataset_hf: openbmb/UltraData-SFT-2605
sft_dataset_ms: OpenBMB/UltraData-SFT-2605
sft_config: null
text_field: content
tokenizer_path: src/tokenizer
# Disable shuffle: the 1000-sample shuffle buffer causes random shard
# access which multiplies per-shard latency and makes the first batch
# take minutes on either CDN. Sequential streaming is fine for the
# v0.0.0 validation run (1000 steps).
shuffle: false

# Output
output_dir: output
log_interval: 10
checkpoint_interval: 100

# GPU
min_gpu_memory_mb: 10240
num_workers: 2
