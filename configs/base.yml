# HippoLM Training Configuration
#
# Parameter explanations live in docs/base_yml_reference.md.
# This file is a pure key → value table; running `diff` against
# it should only show the values that actually changed.

# Model Architecture
vocab_size: 248320
hidden_size: 1536
tie_word_embeddings: true
use_bias: false

# KDA (Kimi Delta Attention)
num_heads: 12
head_dim: 128
expand_v: 1.0
kda_mode: chunk
use_short_conv: true
allow_neg_eigval: false
safe_gate: true
lower_bound: -5.0
conv_size: 4
conv_bias: false

# Architecture Depth
num_layers: 32
num_blocks: 8

# FFN (SwiGLU)
intermediate_size: 4096

# Normalization
rms_norm_eps: 0.000001

# Training
epochs: 1
max_steps: 1000
batch_size: 1
seq_len: 262144
micro_batch_size: 16384
lr_warmup_steps: 0
lr_decay_steps: 100
gradient_accumulation_steps: 16
pack_chunk_size: 64
pack_buffer_size: 2048

# Optimizer hparams
optimizer:
  adamw: { lr: 0.004, weight_decay: 0.01, beta1: 0.9, beta2: 0.95, eps: 1e-8 }
  muon:  { lr: 0.02, weight_decay: 0.0, momentum: 0.95 }
max_grad_norm: 1.0
seed: 42

# Precision
precision:
  model_weights: { dtype: bf16 }
  gradients:     { dtype: bf16 }
  activations:   { dtype: bf16 }
  muon_momentum: { dtype: bf16 }
  adamw_m:       { dtype: bf16 }
  adamw_v:       { dtype: bf16 }

# Stage: pretrain or sft
stage: pretrain

# Data
use_modelscope: true
pretrain_dataset_hf: openbmb/Ultra-FineWeb-L3
pretrain_dataset_ms: OpenBMB/Ultra-FineWeb-L3
pretrain_config: Ultra-FineWeb-L3-en-QA-Synthetic
pretrain_multi_source: true
pretrain_en_multi_config: Ultra-FineWeb-L3-en-Multi-Style-Synthetic
pretrain_zh_multi_config: Ultra-FineWeb-L3-zh-Multi-Style-Synthetic
pretrain_en_qa_config: Ultra-FineWeb-L3-en-QA-Synthetic
pretrain_zh_qa_config: Ultra-FineWeb-L3-zh-QA-Synthetic
sft_dataset_hf: openbmb/UltraData-SFT-2605
sft_dataset_ms: OpenBMB/UltraData-SFT-2605
sft_config: null
text_field: content
tokenizer_path: src/tokenizer
shuffle: false
use_dummy_data: false

# Output
output_dir: output
log_interval: 1
checkpoint_interval: 100
checkpoint_keep_last_n: 3

# GPU
min_gpu_memory_mb: 10240

# TP simulation
tp_sim: false
tp_size: 2

# Misc
mb_timing: 0
empty_cache_between_mb: true
kda_skip_aqk_akk_saved: false

# FFN NVFP4 path
ffn_nvfp4: true
ffn_nvfp4_marlin: true
# Drop the BF16 master weight entirely — only the FP4 packed buffers
# exist on CPU/GPU. The optimizer streams BF16 views through the
# module's material/commit/apply_chunk_update API at chunk granularity
# (~8 MiB BF16 peak surface, regardless of module size). MoE-friendly:
# the per-expert BF16 master that would otherwise scale linearly with
# N_experts is eliminated. Requires ffn_nvfp4_marlin=true (the dequant+
# cuBLAS no-leaf Function exists but isn't wired into the SwiGLU
# pipeline yet).
ffn_nvfp4_no_bf16_master: true
